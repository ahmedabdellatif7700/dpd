# The dpd stage on the Jetson: the service that takes the place of the Pi's pass-through dpd_bb
# (on-chip-training docs/testbed/rpi/PIPELINE.md, DPD place A). It keeps the service's name, so
# its timing log is dpd_bb.csv. As in the user's Jetson CUDA template: runtime nvidia, the
# models mounted read-only. Unlike it: restart "no" (PIPELINE.md 3.5, a stage never restarts on
# its own: it could not resume its stream).
#
#   make -C docker build      make -C docker check      (make -C docker help)
#   DPD_STAGE_DOCKER=1 python -m pytest tests/test_dpd_stage.py    the stage in the image, with a feeder and a sink
#
# The stage (dpd_stage): listens on 7000 as every stage of the Pi does; AROF_OUT_CO_OPTICS points it
# at co_optics on the Pi (the hookup, docs/testbed/jetson/STAGE.md). The mode and the model come in
# the CONFIG frame (the settings file's "dpd": {"bb": {...}}).
name: arof-dpd

services:
  dpd_bb:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: arof-dpd:local
    runtime: nvidia
    restart: "no"
    command: ["dpd_stage"]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      AROF_STAGE: dpd_bb
      AROF_IN: tcp://0.0.0.0:7000                     # where the Pi's source sends (its AROF_OUT)
      AROF_OUT: ${AROF_OUT_CO_OPTICS:-tcp://co_optics:7000}   # co_optics on the Pi (the hookup, step 3)
      AROF_LOG_DIR: /logs
      AROF_CONNECT_TIMEOUT_S: "60"
      AROF_MODELS_DIR: /models
      AROF_DPD_DEVICE: cuda
    ports:
      - "7000:7000"
    volumes:
      - ../results/models:/models:ro    # the weights trained by the Python reference, and the resampler
      - ../logs:/logs
